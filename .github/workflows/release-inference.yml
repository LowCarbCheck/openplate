name: Release Image (inference)

# Builds and publishes the inference self-host image to GHCR.
#
# Two variants come out of ONE Dockerfile, selected by the BASE_IMAGE build-arg
# (the only variant knob there is, GPU offload itself is detected at runtime by
# apps/inference/scripts/docker-entrypoint.sh, there is no build-time GPU flag):
#
#   cpu   ghcr.io/ggml-org/llama.cpp:server        -> :latest, :<semver>, :sha-<short>
#   cuda  ghcr.io/ggml-org/llama.cpp:server-cuda   -> :cuda,   :<semver>-cuda, :sha-<short>-cuda
#
# Both tag sets are what apps/inference/README.md "Quickstart" and
# apps/inference/docker/compose.yml tell people to pull, so neither may be
# dropped without editing those first.
#
# Publishing semver WITHOUT moving a tag: run this workflow manually with the
# `version` input set (e.g. 0.1.0). The semver tags are then applied to whatever
# the current ref already points at. Pushing an `inference-v*` tag does the same
# thing automatically for future releases.
#
# ── ONE REPOSITORY, THREE RELEASE WORKFLOWS (M262) ──
# `apps/inference` lives beside `apps/app` and `apps/core` in one repository,
# and each has a release workflow of its own. Inference's tags carry an
# `inference-` prefix, because the app keeps the bare `v*`. A glob here matches
# from the first character, so `inference-v*` never matches `v0.50.0` or
# `core-v0.23.0`. The PUBLISHED image tags stay bare, `X.Y.Z` and
# `X.Y.Z-cuda`: `docker/metadata-action` cannot parse `inference-v0.2.0` as
# semver, so the `version` step below strips the prefix first.
#
# The `paths` filter is what keeps an app-only push to `main` from rebuilding
# both variants and moving `latest` and `cuda`. GitHub does NOT evaluate
# `paths` for a tag push ("Path filters are not evaluated for pushes of tags",
# workflow syntax reference), so an `inference-v*` tag always releases.
#
# This workflow publishes NO GitHub Release page. If one is ever added it must
# pass `--latest=false`: installed apps ask GitHub for the latest release of
# this repository to find an update, and an inference release must never be it.
on:
  push:
    branches:
      - main
    tags:
      - 'inference-v*'
    paths:
      - 'apps/inference/**'
      - '.github/workflows/release-inference.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional semver to tag this build with (e.g. 0.1.0). Leave empty for latest/cuda + sha tags only.'
        required: false
        default: ''

# One release build at a time per ref. The sibling repos omit this and hit a
# buildx gha-cache race when two runs export cache concurrently. Because the
# semver path here is a workflow_dispatch on `main` rather than a tag push, the
# collision case (main push vs. semver run) shares a ref and is serialised by
# this group. Queued runs wait rather than cancel, a release build must not be
# killed by the next merge.
#
# The WORKFLOW is part of the key, as `release-inference-`. Since M262 the app
# and core release workflows run on the same `main` ref, and a group they shared
# would serialise the three apps, or evict a waiting release of another app.
concurrency:
  group: release-inference-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Hardcoded since M262, no longer derived from the repository name: that is
  # `LowCarbCheck/openplate` for all three release workflows now, so deriving
  # it would publish inference into the app's package. The org has already
  # moved once (SPRQVNTRS -> LowCarbCheck), so a second move means editing this
  # line. Lowercase, because GHCR rejects uppercase paths.
  IMAGE_NAME: lowcarbcheck/openplate-inference

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Platforms are limited to what the BASE image actually publishes,
          # never QEMU-build onto a base that has no such manifest.
          #
          # llama.cpp:server      -> amd64, arm64, s390x
          # llama.cpp:server-cuda -> amd64, arm64
          #
          # s390x is skipped (no plausible self-host audience, and sharp has no
          # prebuilt binary for it). CUDA arm64 exists upstream (Jetson / GH200)
          # but is left off for now: it would be a QEMU-emulated build on a
          # multi-GB CUDA base, and every GPU instruction we ship is x86. Add
          # `linux/arm64` to the cuda row when someone actually needs it.
          - variant: cpu
            base_image: ghcr.io/ggml-org/llama.cpp:server
            platforms: linux/amd64,linux/arm64
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=semver,pattern={{version}},value={{SEMVER}}
              type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
              type=sha,prefix=sha-,format=short
          - variant: cuda
            base_image: ghcr.io/ggml-org/llama.cpp:server-cuda
            platforms: linux/amd64
            tags: |
              type=raw,value=cuda,enable={{is_default_branch}}
              type=semver,pattern={{version}},suffix=-cuda,value={{SEMVER}}
              type=raw,value=${{ inputs.version }}-cuda,enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
              type=sha,prefix=sha-,format=short,suffix=-cuda

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `inference-v0.2.0` is not semver, so `type=semver` would skip it with a
      # warning and the release would publish no version tag at all. The bare
      # `0.2.0` goes in through `value=` instead. It stays EMPTY on a branch
      # push or a manual run, because a `type=semver` with a value is emitted
      # on any event. The matrix rows carry `{{SEMVER}}` as a placeholder,
      # because a matrix value cannot read a step output.
      - name: Strip the tag prefix
        id: version
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/inference-v*) semver="${GITHUB_REF_NAME#inference-v}" ;;
            *) semver="" ;;
          esac
          {
            echo "tags<<EOF_TAGS"
            printf '%s\n' "${TAGS//\{\{SEMVER\}\}/$semver}"
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.version.outputs.tags }}
          # `latest` and `cuda` come ONLY from the `enable={{is_default_branch}}`
          # rows above. The action's default, `latest=auto`, adds a bare
          # `latest` to every non-prerelease semver tag and ignores the row's
          # `-cuda` suffix, so a tag run of the cuda row would push the
          # amd64-only cuda image as `latest`, over the cpu one. Found in M262,
          # before the first `inference-v*` tag.
          flavor: latest=false

      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: apps/inference
          file: apps/inference/Dockerfile
          platforms: ${{ matrix.platforms }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-variant cache scope: the two variants share no layers below the
          # build stage, and one gha scope for both just evicts the other. The
          # `inference-` prefix is there because the Actions cache is shared by
          # the whole repository since M262.
          cache-from: type=gha,scope=inference-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=inference-${{ matrix.variant }}


  # ── Tell the website ───────────────────────────────────────────────────────
  # openplate.de quotes inference's README table and `docs/*.md`, and it quotes
  # them at the latest published release rather than at `main`, because the
  # site documents what a reader can install. This trigger is what makes that
  # immediate instead of up to a day late; the site also syncs daily, so a
  # missed trigger heals itself.
  #
  # NO `needs:`. It runs beside the image build, not after it. The v0.10.0 and
  # v0.10.1 tag runs of openplate both HUNG in "Build and push" (M192
  # follow-up), and a dispatch waiting on that job would have been eaten by the
  # hang. Nothing about re-quoting the docs depends on an image existing.
  #
  # IT CARRIES THE TAG FOR THE RECORD AND NOTHING ELSE READS IT. Which release
  # the site documents is decided in one place, `highestTag` in the site's
  # sync-docs.ts, which takes the highest tag under each app's own prefix. A tag
  # passed as an instruction would be a second answer to that question.
  #
  # ── IN-REPO SINCE M262 ──
  # The site lives in this repository now, so this starts `sync-docs.yml` with
  # `gh workflow run` instead of a `repository_dispatch` to another repository.
  # `GITHUB_TOKEN` is enough, because a `workflow_dispatch` is the one kind of
  # event it may start a run with; release-app.yml says more. Nothing depends
  # on this job, so a marketing site not hearing about a release can never fail
  # one.
  dispatch-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Tags only. `if:` can only test the ref's start; the prerelease test is in
    # the shell, because `inference-v0.2.0` already carries a hyphen and the old
    # `!contains(github.ref_name, '-')` would have skipped every release.
    if: ${{ startsWith(github.ref, 'refs/tags/inference-v') }}
    permissions:
      # `gh workflow run` creates a workflow_dispatch event.
      actions: write
    steps:
      - name: Ask openplate.de to re-quote the docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No prerelease: the site only ever quotes a released line.
          case "${GITHUB_REF_NAME#inference-v}" in
            *-*) echo "prerelease $GITHUB_REF_NAME, the site does not quote it"; exit 0 ;;
          esac
          gh workflow run sync-docs.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f repo=openplate-inference \
            -f "tag=$GITHUB_REF_NAME"
