name: Release Image (core)

# Builds and publishes the core self-host image to GHCR on every push to `main`
# that touches core (moving `main`) and on version tags (`core-v*`, e.g.
# `core-v0.1.0`).
#
# The package stays PRIVATE until this repo is flipped to public visibility.
# The workflow needs no change when that happens, it already publishes to the
# right place under the right name; only the package's visibility setting has
# to move.
#
# ── ONE REPOSITORY, THREE RELEASE WORKFLOWS (M262) ──
# `apps/core` lives beside `apps/app` and `apps/inference` in one repository,
# and each has a release workflow of its own. Core's tags carry a `core-`
# prefix, because the app keeps the bare `v*`. A glob here matches from the
# first character, so `core-v*` never matches `v0.50.0` or `inference-v0.2.0`.
#
# The PUBLISHED image tag is still a bare `X.Y.Z`: Bay pins
# `ghcr.io/lowcarbcheck/openplate-core:0.22.0`, and a `core-` prefix in the
# image tag would break that pin. `docker/metadata-action` cannot parse
# `core-v0.22.0` as semver, so the `version` step below strips the prefix and
# hands the action a bare value.
#
# The `paths` filter is what keeps an app-only push to `main` from rebuilding
# this image and moving its `main` tag. GitHub does NOT evaluate `paths` for a
# tag push ("Path filters are not evaluated for pushes of tags", workflow
# syntax reference), so a `core-v*` tag always releases.
#
# This workflow publishes NO GitHub Release page. If one is ever added it must
# pass `--latest=false`: installed apps ask GitHub for the latest release of
# this repository to find an update, and a core release must never be it.
on:
  push:
    branches:
      - main
    tags:
      - 'core-v*'
    paths:
      - 'apps/core/**'
      - '.github/workflows/release-core.yml'

env:
  REGISTRY: ghcr.io
  # Hardcoded, no longer derived from the repository name: that is
  # `LowCarbCheck/openplate` for all three release workflows now, so deriving
  # it would publish core into the app's package. Lowercase, because GHCR
  # rejects uppercase paths.
  IMAGE_NAME: lowcarbcheck/openplate-core

jobs:
  # ── Resolve the ref to the COMMIT it points at ─────────────────
  # The build job below serialises on the commit, so it needs a value that is
  # the same for the `main` push and for the `core-v*` tag push of one release.
  # `github.sha` is NOT that value. For an ANNOTATED tag the ref points at a tag
  # OBJECT with its own SHA, so the two runs would key on different values, land
  # in different groups, and race exactly as they do today, while the workflow
  # file still looked correct and every static check still passed.
  #
  # This is not hypothetical. Both repositories have shipped annotated tags
  # recently: openplate v0.15.0 and v0.14.0, core v0.8.0, v0.7.0,
  # v0.6.2 and v0.6.1. There is no rule anywhere that says which style to use.
  # Rather than making the fix depend on a habit, this job removes the variable.
  #
  # `actions/checkout` puts the target COMMIT at HEAD for a branch, a
  # lightweight tag and an annotated tag alike, so `git rev-parse HEAD` is the
  # one value all three agree on.
  resolve-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the ref to its commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Wait for the sibling run, WITHOUT holding the group ───────
  # A coordinated release pushes `main` and then the `core-v*` tag seconds
  # later, so the tag run must let the branch run settle before `reuse` reads
  # the registry. This job does the waiting and carries NO concurrency group,
  # for the reason release-app.yml gives: on 2026-09-11 a wait inside the group
  # that `merge` also needs held both runs until the timeout.
  #
  # `--workflow` names this FILE, because the app and inference release
  # workflows run on the same commits. A sibling that FAILED must not stop the
  # release, so `--exit-status` is swallowed; the point is only that it is
  # finished. A timed out wait skips `reuse`, and the release builds instead.
  wait-for-branch-run:
    needs: resolve-commit
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Wait for the branch run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve-commit.outputs.sha }}
        run: |
          set -uo pipefail
          export GH_REPO="$GITHUB_REPOSITORY"
          ids=$(gh run list --workflow release-core.yml --commit "$SHA" --limit 50 \
            --json databaseId,status \
            --jq '.[] | select(.status != "completed") | .databaseId' \
            | grep -vx "$GITHUB_RUN_ID" || true)
          if [ -z "$ids" ]; then
            echo "no other run of $GITHUB_WORKFLOW is open on $SHA"
            exit 0
          fi
          echo "waiting on run ids: $(echo "$ids" | tr '\n' ' ')"
          for id in $ids; do
            echo "::group::run $id"
            gh run watch "$id" --exit-status || true
            echo "::endgroup::"
          done

  # ── Copy, do not rebuild ───────────────────────────────────────
  # `wait-for-branch-run` makes this job start only after the branch run of the
  # same commit has finished or failed, so what it published is a SETTLED fact
  # and the registry lookup below is exact.
  #
  # If the commit already has a two platform `sha-` image, the semver tag becomes
  # a manifest COPY of it: seconds, no layers pushed, no cache exported. Every
  # other case falls through to the build: no image, a pruned image, a single
  # platform image, or a copy that failed. A SINGLE PLATFORM source is never
  # copied, because that would silently drop `linux/arm64` from the release, and
  # self-hosters on a Raspberry Pi or an ARM VPS pull that platform.
  #
  # Tagging an OLD commit lands here too, and copying is the more faithful answer
  # than a fresh build. A tag on a commit whose `main` push touched nothing under
  # `apps/core` finds no `sha-` image, because the `paths` filter skipped that
  # branch run, and it builds.
  #
  # The source is keyed on the RESOLVED commit, never on `github.sha`: an
  # annotated tag's `github.sha` is the tag OBJECT, and no `sha-` image is ever
  # published under it. `latest` moves here, and only on a tag: it names the
  # newest release, which is what the docs describe; a push to `main` moves the
  # `main` tag instead. `--annotation` rewrites the copied OCI
  # version label so the semver tag states its own version.
  #
  # This is a JOB, not a step, because each platform builds in a matrix job of
  # its own now. Gating a step would leave both legs running.
  reuse:
    needs:
      - resolve-commit
      - wait-for-branch-run
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # The plain group, the same one `merge` holds, so this lookup never reads
    # the registry while the branch run's `merge` is still assembling.
    concurrency:
      group: release-core-${{ needs.resolve-commit.outputs.sha }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      done: ${{ steps.reuse.outputs.done }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the branch image if it published
        id: reuse
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA: ${{ needs.resolve-commit.outputs.sha }}
        run: |
          set -uo pipefail
          src="$IMAGE:sha-${SHA:0:7}"
          version="${GITHUB_REF_NAME#core-v}"
          plats=$(docker buildx imagetools inspect "$src" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' 2>/dev/null || true)
          echo "source $src carries: ${plats:-<no image>}"
          case "$plats" in
            *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) ;;
            *)
              echo "::notice::no two platform image at $src, so this release builds instead"
              echo "done=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          if docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=$version" \
            -t "$IMAGE:$version" -t "$IMAGE:latest" "$src"; then
            docker buildx imagetools inspect "$IMAGE:$version"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the copy of $src failed, so this release builds instead"
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  # ── One platform per NATIVE runner ─────────────────────────────
  # Until 0.23.2 one job built both platforms on an x86 runner, with arm64
  # under QEMU. On 2026-09-29 core-v0.23.1 and its branch run both died the
  # same way: `qemu: uncaught target signal 4 (Illegal instruction)` in the
  # arm64 `pnpm install`, then a silent hang to the 45 minute timeout. The same
  # base image, pnpm and QEMU had built fine the night before, so it depends on
  # the runner's machine, not on the commit. The app hit it on 2026-09-09 and
  # moved to native runners then; release-app.yml is the worked example.
  #
  # Each platform now builds on a runner of its own architecture, pushes by
  # digest, and `merge` below assembles the tagged manifest list. No QEMU is
  # set up anywhere in this workflow.
  #
  # Each leg holds a PER PLATFORM group, so a stuck leg holds only its own
  # platform, and the branch and tag runs of one commit still never build the
  # same platform at once. The cache scope is named for core AND the platform,
  # because the Actions cache is shared by the whole repository and the app's
  # legs use the bare platform as their scope.
  build:
    needs:
      - resolve-commit
      - reuse
    # `reuse` is skipped on a branch push, and a skipped need would skip this
    # job too without the explicit condition.
    if: ${{ !cancelled() && needs.resolve-commit.result == 'success' && needs.reuse.outputs.done != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: release-core-${{ needs.resolve-commit.outputs.sha }}-${{ matrix.slug }}
      cancel-in-progress: false
    # A native build of either platform takes a few minutes, so 20 fails a
    # genuine hang well inside the old 45.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/core
          file: apps/core/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=core-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.slug }}

      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the tags from the digests ─────────────────────────
  # Holds the plain group, like `reuse`, so a tag run's lookup never reads a
  # half assembled manifest list. An amd64 leg that failed stops the release,
  # because production runs x86_64. An arm64 leg that failed publishes an
  # amd64-only tag with a warning, so a flaky arm runner never blocks a deploy.
  merge:
    needs:
      - resolve-commit
      - reuse
      - build
    if: ${{ !cancelled() && needs.resolve-commit.result == 'success' && needs.reuse.outputs.done != 'true' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-core-${{ needs.resolve-commit.outputs.sha }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: Check which platforms built
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          if [ -z "$(find digests-amd64 -type f 2>/dev/null || true)" ]; then
            echo "::error::No linux/amd64 digest was uploaded, so that leg did not build. Production runs x86_64, so this release publishes no tag."
            exit 1
          fi
          if [ -z "$(find digests-arm64 -type f 2>/dev/null || true)" ]; then
            echo "::warning::No linux/arm64 digest was uploaded. The manifest list is single-platform, linux/amd64 only, and an arm64 host cannot pull this tag."
          fi
          echo "platforms with a digest:"
          find . -type f

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `core-v0.22.0` is not semver, so `type=semver` would skip it with a
      # warning and the release would publish no version tag at all. The bare
      # `0.22.0` goes in through `value=` instead. It stays EMPTY on a branch
      # push, because a `type=semver` with a value is emitted on any event.
      - name: Strip the tag prefix
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/core-v*) echo "semver=${GITHUB_REF_NAME#core-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "semver=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is the newest release and `main` the newest `main` push.
          # `latest=false` stops the action adding its own `latest` to every
          # semver tag, so the rows below are the only source of either.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.semver }}
            type=sha,prefix=sha-,format=short

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          refs=()
          for file in */*; do
            refs+=("${REGISTRY}/${IMAGE_NAME}@sha256:$(basename "$file")")
          done
          echo "assembling from: ${refs[*]}"
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${refs[@]}"

      - name: Inspect the manifest list
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"


  # ── Tell the website ───────────────────────────────────────────────────────
  # openplate.de quotes core's README table and `docs/*.md`, and it quotes them
  # at the latest published release rather than at `main`, because the site
  # documents what a reader can install. This trigger is what makes that
  # immediate instead of up to a day late; the site also syncs daily, so a
  # missed trigger heals itself.
  #
  # NO `needs:`. It runs beside the image build, not after it. The v0.10.0 and
  # v0.10.1 tag runs of openplate both HUNG in "Build and push" (M192
  # follow-up), and a dispatch waiting on that job would have been eaten by the
  # hang. Nothing about re-quoting the docs depends on an image existing.
  #
  # IT CARRIES THE TAG FOR THE RECORD AND NOTHING ELSE READS IT. Which release
  # the site documents is decided in one place, `highestTag` in the site's
  # `scripts/sync-docs.ts`, which takes the highest tag under each app's own
  # prefix. A tag passed as an instruction would be a second answer to that
  # question.
  #
  # ── ACROSS REPOSITORIES SINCE 2026-10-02 ──
  # The site lives in the private repository LowCarbCheck/openplate-website, so
  # this starts its `sync-docs.yml` with `gh workflow run --repo`. The built-in
  # `GITHUB_TOKEN` cannot reach another repository, so the step reads
  # `OPENPLATE_WEBSITE_DISPATCH_TOKEN`, a token that may run workflows there.
  # While that secret is unset the step prints a notice and exits 0, and the
  # site's daily cron re-quotes within a day. `continue-on-error` keeps a
  # failed dispatch from failing the release. Nothing depends on this job, so
  # a marketing site not hearing about a release can never fail one.
  dispatch-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Tags only. `if:` can only test the ref's start; the prerelease test is in
    # the shell, because `core-v0.23.0` already carries a hyphen and the old
    # `!contains(github.ref_name, '-')` would have skipped every core release.
    if: ${{ startsWith(github.ref, 'refs/tags/core-v') }}
    # The built-in token reaches no other repository, so it needs no scope.
    permissions:
      contents: read
    steps:
      - name: Ask openplate.de to re-quote the docs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OPENPLATE_WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::OPENPLATE_WEBSITE_DISPATCH_TOKEN is unset, so this run did not tell the site. The site's daily cron will re-quote the docs within a day."
            exit 0
          fi
          set -euo pipefail
          # No prerelease: the site only ever quotes a released line.
          case "${GITHUB_REF_NAME#core-v}" in
            *-*) echo "prerelease $GITHUB_REF_NAME, the site does not quote it"; exit 0 ;;
          esac
          gh workflow run sync-docs.yml --repo LowCarbCheck/openplate-website --ref main \
            -f repo=openplate-core \
            -f "tag=$GITHUB_REF_NAME"
