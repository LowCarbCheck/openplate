name: Release Image

# Builds and publishes the self-host image to GHCR on every push to `main`
# (moving `latest`) and on version tags (`v*`, e.g. `v1.2.0`).
#
# Public `docker pull` access is gated on this repo (and the resulting
# package) being flipped to public visibility, see README "Self-hosting".
# Until then this workflow still runs and publishes to the private package;
# it's ready to go the moment visibility flips, no workflow change needed.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  # ── Resolve the ref to the COMMIT it points at ─────────────────
  # The build job below serialises on the commit, so it needs a value that is
  # the same for the `main` push and for the `v*` tag push of one release.
  # `github.sha` is NOT that value. For an ANNOTATED tag the ref points at a tag
  # OBJECT with its own SHA, so the two runs would key on different values, land
  # in different groups, and race exactly as they do today, while the workflow
  # file still looked correct and every static check still passed.
  #
  # This is not hypothetical. Both repositories have shipped annotated tags
  # recently: openplate v0.15.0 and v0.14.0, openplate-sync v0.8.0, v0.7.0,
  # v0.6.2 and v0.6.1. There is no rule anywhere that says which style to use.
  # Rather than making the fix depend on a habit, this job removes the variable.
  #
  # `actions/checkout` puts the target COMMIT at HEAD for a branch, a
  # lightweight tag and an annotated tag alike, so `git rev-parse HEAD` is the
  # one value all three agree on.
  resolve-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the ref to its commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Copy, do not rebuild ───────────────────────────────────────
  # A coordinated release pushes `main` and then the `v*` tag at the same commit,
  # and the concurrency group makes the tag run start only after the branch run
  # has finished or failed. So whatever the branch run published is a SETTLED
  # fact by the time this runs, never a race, and a registry lookup here is
  # exact. That is what makes copying safe at all.
  #
  # If the commit already has a two platform `sha-` image, the semver tag becomes
  # a manifest COPY of it: seconds, no layers pushed, no cache exported. Every
  # other case falls through to the build below and behaves exactly as it does
  # today: no image, a pruned image, a single platform image, or a copy that
  # failed. A SINGLE PLATFORM source is never copied, because that would silently
  # drop `linux/arm64` from the release, and self-hosters on a Raspberry Pi or an
  # ARM VPS pull that platform.
  #
  # Tagging an OLD commit lands here too, and copying is the more faithful answer
  # than a fresh build: the `sha-` image is what that commit actually produced,
  # against the base image of that day.
  #
  # The source is keyed on the RESOLVED commit, never on `github.sha`, for the
  # same reason the group is: an annotated tag's `github.sha` is the tag OBJECT,
  # and no `sha-` image is ever published under it.
  #
  # `latest` is untouched. It is emitted only with `enable={{is_default_branch}}`,
  # so a tag run never moved it and still does not.
  #
  # A copy carries the source's OCI labels, whose version says the `sha-` tag.
  # `--annotation` rewrites that one value on the new index so the semver tag
  # states its own version.
  #
  # This lives at JOB level here, not at step level as it does in
  # openplate-core, because this workflow builds each platform in a matrix job
  # of its own. Gating a single step would leave both legs running, and the
  # second build is the whole thing this removes.
  #
  # ── Why this job WAITS before it looks ────────────────────────
  # The group below only covers `merge`. The build legs hold PER PLATFORM
  # groups of their own, so during the minutes they are compiling the plain
  # group is EMPTY. In the coordinated case, `main` and then the `v*` tag
  # seconds later, this job would win that empty group, find no `sha-` image
  # yet, and hand the release straight back to a full double build, which is
  # the one case this milestone exists for. So the wait on the sibling run,
  # not the group, is what turns a coordinated release into a copy.
  reuse:
    needs: resolve-commit
    # Tags only. A push to `main` IS the build that a later tag copies.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    # The plain group, the same one `merge` holds. Without it this job could
    # read the registry while the branch run's `merge` was still assembling
    # that commit's manifest list, and the lookup would be a race again, which
    # is exactly what the queue exists to remove.
    concurrency:
      group: release-image-${{ needs.resolve-commit.outputs.sha }}
      cancel-in-progress: false

    # This job now sits through a whole sibling build before it looks, so it is
    # sized for one, not for the few registry calls it then makes. Overrunning
    # is safe rather than fatal: a timed out `reuse` publishes no `done`, and
    # `build` reads that as "build", so the release falls back.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # `gh run list` and `gh run watch` read this workflow's other runs.
      actions: read
    outputs:
      done: ${{ steps.reuse.outputs.done }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # `gh` is preinstalled on hosted runners. This job runs NO checkout, so
      # `gh` has no repository to infer, and `GH_REPO` is what names it.
      #
      # A sibling that FAILED must not stop the release, so `--exit-status` is
      # swallowed: the point is only that the sibling is finished, so the
      # registry lookup below reads a settled answer either way.
      - name: Wait for the branch run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-commit.outputs.sha }}
        run: |
          set -uo pipefail
          ids=$(gh run list --workflow "$GITHUB_WORKFLOW" --commit "$SHA" --limit 50 \
            --json databaseId,status \
            --jq '.[] | select(.status != "completed") | .databaseId' \
            | grep -vx "$GITHUB_RUN_ID" || true)
          if [ -z "$ids" ]; then
            echo "no other run of $GITHUB_WORKFLOW is open on $SHA"
            exit 0
          fi
          echo "waiting on run ids: $(echo "$ids" | tr '\n' ' ')"
          for id in $ids; do
            echo "::group::run $id"
            gh run watch "$id" --exit-status || true
            echo "::endgroup::"
          done

      - name: Reuse the branch image if it published
        id: reuse
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SHA: ${{ needs.resolve-commit.outputs.sha }}
        run: |
          set -uo pipefail
          src="$IMAGE:sha-${SHA:0:7}"
          version="${GITHUB_REF_NAME#v}"
          plats=$(docker buildx imagetools inspect "$src" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' 2>/dev/null || true)
          echo "source $src carries: ${plats:-<no image>}"
          case "$plats" in
            *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) ;;
            *)
              echo "::notice::no two platform image at $src, so this release builds instead"
              echo "done=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          if docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=$version" \
            -t "$IMAGE:$version" "$src"; then
            docker buildx imagetools inspect "$IMAGE:$version"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the copy of $src failed, so this release builds instead"
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  # ── One platform per NATIVE runner ─────────────────────────────
  # Until 2026-09-09 this was a single job that built linux/amd64 and
  # linux/arm64 together on an x86 runner, with the arm64 half emulated by
  # QEMU. Emulation is what broke: on the v0.21.0 and v0.22.0 tag runs the
  # emulated arm64 process died with "qemu: uncaught target signal 4 (Illegal
  # instruction)", buildkit kept waiting for a worker that was gone, and the
  # job only ended when the timeout cancelled it. NO image was pushed at all,
  # not even the amd64 half that had built fine, because one push of a
  # manifest list is one atomic step. The v0.10.0 and v0.10.1 runs hung the
  # same way.
  #
  # So each platform now builds on a runner of its own architecture and no
  # emulator is installed: linux/amd64 on ubuntu-latest, linux/arm64 on
  # ubuntu-24.04-arm, GitHub's hosted arm runner, free for public
  # repositories. Each leg pushes an image by DIGEST only, with no tag, and
  # the `merge` job below assembles the tagged manifest list from the digests.
  #
  # fail-fast is off so a broken arm64 leg does not cancel the amd64 leg that
  # production actually pulls. A leg that hangs now costs its own platform and
  # nothing else.
  build:
    needs:
      - resolve-commit
      - reuse
    # ── Why this is not a plain `needs:` ──────────────────────────
    # On a push to `main` the `reuse` job above is SKIPPED, and GitHub skips a
    # dependent job when a job it needs was skipped, UNLESS that dependent's
    # `if:` uses a status check function. So `!cancelled()` is load bearing: it
    # is what lets a branch push build at all. Drop it and this repository
    # stops publishing images entirely, while the file still reads correctly.
    #
    # A skipped `reuse` also yields an EMPTY `done`, and empty is not 'true',
    # so a branch push builds. A `reuse` that ran and copied yields 'true' and
    # this job is skipped. A `reuse` that ran and FAILED yields empty as well,
    # so the release falls back to a build rather than publishing nothing.
    if: ${{ !cancelled() && needs.resolve-commit.result == 'success' && needs.reuse.outputs.done != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
            # Turns on the probe step below. Only this leg has ever failed.
            probe: true

    # ── Why this job queues ─────────────────────────────────────
    # A coordinated release pushes `main` and then the `v*` tag seconds later.
    # Both refs point at the SAME commit, so both start this job. On 2026-09-08
    # the second one to start missed the first one's not yet exported buildx
    # cache and rebuilt from nothing: openplate v0.17.0 sat 42 minutes and never
    # finished, openplate-sync v0.9.0 sat 26 minutes. A warm run takes under 3
    # minutes.
    #
    # The group is keyed on the COMMIT, resolved by the job above rather than
    # taken from `github.sha`. Not on the ref, because the branch push and the
    # tag push carry different refs and must land in ONE group. Not on the
    # repository, because that is wider than the problem: it would queue every
    # ordinary push to `main` behind every other one, and GitHub keeps
    # only ONE run waiting per group. A newer arrival evicts an older waiting
    # run even when cancel-in-progress is false, so a wide key could DROP a
    # release build rather than delay it. Keying on the commit bounds this
    # queue at two, the branch run and the tag run, so nothing is ever evicted.
    #
    # The PLATFORM is part of the key as well, because the two legs build
    # different artifacts from different caches and have no reason to wait for
    # each other. Serialising is per platform, so a stuck amd64 leg holds only
    # the amd64 slot.
    #
    # cancel-in-progress MUST stay false. Cancelling a release run is the
    # failure this block exists to prevent; see the dispatch-website note below.
    #
    # EXPECT a release to take about twice one build, roughly 5 to 8 minutes end
    # to end, because the tag run starts only after the branch run finishes. A
    # job held here reads "Queued" in the Actions UI. Queued is not hung. Do not
    # cancel it.
    concurrency:
      group: release-image-${{ needs.resolve-commit.outputs.sha }}-${{ matrix.slug }}
      cancel-in-progress: false

    # Ordering the two runs cannot stop a stall from a GHCR outage or a poisoned
    # cache, and a stuck leg still holds its own slot in the group. GitHub's own
    # default would let it sit for six hours. A native build of either platform
    # is minutes, cold or warm, now that nothing is emulated, so 20 is generous
    # and still fails a genuine hang inside the half hour. The 45 that stood
    # here was sized for a cold emulated arm64 build, which no longer exists.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Only the LABELS are read here. The tags are decided once, in the merge
      # job, because a leg pushes no tag at all.
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # ── A probe, not a build step ─────────────────────────────────
      # On the v0.22.1 run this leg failed after 27 seconds at
      # `RUN pnpm i --frozen-lockfile` with exit code 1 and NOT ONE line of
      # pnpm output, so the log said nothing about why. This runs the same
      # base image the Dockerfile uses, `node:22-alpine`, and installs pnpm
      # the same way it does, so the next run's log shows whether pnpm itself
      # works on this runner. It is a few seconds of pulls, it builds nothing,
      # and `continue-on-error` keeps it from ever deciding the leg.
      - name: Probe pnpm on the arm64 runner
        if: ${{ matrix.probe }}
        continue-on-error: true
        run: docker run --rm --platform linux/arm64 node:22-alpine sh -c 'node -v && npm i -g pnpm && pnpm -v'

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pnpm
          platforms: ${{ matrix.platform }}
          # The commit the bundle is stamped with. The build cannot read it
          # itself: `.dockerignore` excludes `.git` and the base image has no
          # git. Use the resolved commit, not `github.sha`, for the same reason
          # the concurrency group above does: an annotated tag's `github.sha` is
          # the tag object, not the commit.
          build-args: |
            OPENPLATE_BUILD_SHA=${{ needs.resolve-commit.outputs.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          # `push-by-digest` publishes the layers and the image manifest under
          # its own digest and attaches NO tag. `name-canonical` records the
          # repository in that manifest so `imagetools create` can address it.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          # One cache per platform. A shared scope would have the two legs
          # overwrite each other's export and neither would ever be warm.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The digest is passed to the merge job as a FILE NAME with an empty file
      # under it, which is the pattern documented by Docker in "Multi-platform
      # image with GitHub Actions", section "Distribute build across multiple
      # runners". An artifact is the only channel here: a matrix leg cannot
      # write a job output the other legs would not clobber.
      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          # A leg that built but exported nothing is a bug in this file, not a
          # narrower release, so it fails here. A leg that FAILED uploads no
          # artifact at all, and the merge job reports that platform missing.
          if-no-files-found: error
          retention-days: 1

  # ── The tagged manifest list ───────────────────────────────────────────────
  # The legs above push untagged, per platform images. This job is what makes
  # `ghcr.io/lowcarbcheck/openplate:0.22.0` exist, and it is the ONLY place tags
  # are decided, with exactly the rules the old single job used.
  #
  # IT PUBLISHES WHAT BUILT. On the v0.22.1 run the amd64 leg pushed its digest
  # in five minutes and the arm64 leg failed, and because this job simply needed
  # `build` it was skipped: no `0.22.1` tag existed in GHCR at all, while a
  # perfectly good amd64 image sat there addressable only by digest. Production
  # is x86_64, so the release cost far more than the platform that broke.
  #
  # So the gate is the amd64 leg, not the matrix. `!cancelled()` is what lets
  # this job run past a failed leg; a plain `if: success()` or no `if` at all
  # skips on any failure in `needs`. `resolve-commit` must still have succeeded,
  # because its output keys the concurrency group below. A missing arm64 leg is
  # REPORTED, as a `::warning::` and in the inspect output, and is not fatal.
  merge:
    needs:
      - resolve-commit
      - reuse
      - build
    # `needs.build.result != 'skipped'` is what keeps a COPIED release from
    # assembling a manifest list out of digests that were never built: with no
    # artifacts to download the create step would fail and paint a green
    # release red. On the build path nothing changes, because a matrix job
    # whose arm64 leg failed reports 'failure', never 'skipped', so amd64 still
    # publishes exactly as it does today.
    if: ${{ !cancelled() && needs.resolve-commit.result == 'success' && needs.reuse.outputs.done != 'true' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest

    # The plain group, without a platform. The branch run and the tag run of one
    # commit must not write the same tags at the same time, and for the same
    # reasons as the legs: keyed on the resolved commit, never cancelling.
    concurrency:
      group: release-image-${{ needs.resolve-commit.outputs.sha }}
      cancel-in-progress: false

    # No build happens here. This is a few registry calls.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # NOT `merge-multiple`. Merging flattens every artifact into one directory
      # and a digest file is named after the digest, so the platform it came
      # from would be unreadable and the guard below could not tell an
      # amd64-only run from an arm64-only one. Left unmerged, each artifact
      # keeps its own `digests-<slug>` directory. A pattern that matches nothing
      # is a warning here, never an error, which is the point: a failed leg
      # uploads no artifact and this step must still succeed.
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      # The one hard requirement. amd64 is the platform production pins, so
      # without it there is nothing worth tagging and the release must fail
      # loudly. arm64 missing only narrows the manifest list, and the warning
      # is what an operator reads when a self-hoster reports "no matching
      # manifest for linux/arm64" on that version.
      - name: Check which platforms built
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          if [ -z "$(find digests-amd64 -type f 2>/dev/null || true)" ]; then
            echo "::error::No linux/amd64 digest was uploaded, so that leg did not build. Production runs x86_64, so this release publishes no tag."
            exit 1
          fi
          if [ -z "$(find digests-arm64 -type f 2>/dev/null || true)" ]; then
            echo "::warning::No linux/arm64 digest was uploaded. The manifest list is single-platform, linux/amd64 only, and an arm64 host cannot pull this tag."
          fi
          echo "platforms with a digest:"
          find . -type f

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      # Over WHATEVER DIGESTS EXIST, one or two, which is what makes a broken
      # leg cost only its own platform. `*/*` walks the per artifact
      # directories the download step kept, and each file name is the digest.
      # The tags come from the metadata action's JSON rather than its newline
      # separated output, because each one needs its own `-t`.
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          refs=()
          for file in */*; do
            refs+=("${REGISTRY}/${IMAGE_NAME}@sha256:$(basename "$file")")
          done
          echo "assembling from: ${refs[*]}"
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${refs[@]}"

      # Prints the platforms the list actually carries. Read this line when a
      # self-hoster reports "no matching manifest for linux/arm64".
      - name: Inspect the manifest list
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

  # ── Tell the website ───────────────────────────────────────────────────────
  # openplate.de quotes this repository's README table and `docs/*.md`, and it
  # quotes them at the latest published release rather than at `main`, because
  # the site documents what a reader can install. This dispatch is what makes
  # that immediate instead of up to a day late; the site also syncs daily, so a
  # missed dispatch heals itself.
  #
  # NO `needs:`. It runs beside the image build, not after it. The v0.10.0 and
  # v0.10.1 tag runs of openplate both HUNG in the image build (M192
  # follow-up), as did v0.21.0 and v0.22.0, and a dispatch waiting on that build
  # would have been eaten by every one of those hangs. Nothing about re-quoting
  # the docs depends on an image existing.
  #
  # IT CARRIES THE TAG FOR THE RECORD AND NOTHING ELSE READS IT. Which release
  # the site documents is decided in one place, `highestTag` in the site's
  # sync-docs.ts, which takes the highest vX.Y.Z tag. A tag passed as an
  # instruction would be a second answer to that question.
  #
  # The credential is a fine-grained PAT and those expire inside a year; when it
  # does, this 401s. Nothing depends on this job, so a marketing site not
  # hearing about a release can never fail one.
  dispatch-website:
    runs-on: ubuntu-latest
    # Tags only, and no prerelease: the site only ever quotes a released line.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    steps:
      - name: Ask openplate.de to re-quote the docs
        env:
          GH_TOKEN: ${{ secrets.OPENPLATE_WEBSITE_DISPATCH_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/openplate-website/dispatches" \
            -f event_type=openplate-released \
            -f "client_payload[repo]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[tag]=$GITHUB_REF_NAME"

  # ── The GitHub Release page ────────────────────────────────────────────────
  # The page an operator reads to decide whether to pin the new image tag. Its
  # body is generated from CHANGELOG.md by `scripts/release-notes.ts`: the bold
  # lead of every bullet in that version's section, under its group heading,
  # then a link into the changelog for the detail and a compare link against the
  # previous tag.
  #
  # NO `needs:`, and outside the build's concurrency groups, for the same reason
  # `dispatch-website` above is: the v0.10.0, v0.10.1, v0.21.0 and v0.22.0 tag
  # runs all HUNG in the image build, and a release page waiting on it would
  # have been eaten by the hang. Nothing about publishing the notes depends on
  # an image existing, and the image is found by tag whenever it lands.
  #
  # NO `--generate-notes`. GitHub's generated summary only knows merged pull
  # requests, and almost all of this repository's history lands as direct
  # commits, so that list reads as an almost empty release. CHANGELOG.md is the
  # one record, and the page is built from it.
  #
  # There is deliberately no fallback body. The script exits 1 when the section
  # cannot be read (no heading for this version, a bullet with no bold lead, a
  # bullet above every group heading), and a release published without it would
  # list nothing at all. `tests/unit/release-notes.test.ts` runs the same checks
  # over this repository's real CHANGELOG.md in the pre-push gate, so this step
  # failing means the tag was pushed past that gate. Fix CHANGELOG.md, push, and
  # re-run this workflow.
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Tags only. A push to `main` moves `latest` and publishes no release page.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # The one job here that writes anything back to the repository.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The notes carry a compare link against the PREVIOUS tag, and the step
          # below asks git for it with `git describe --tags`. A default checkout
          # is one commit deep and carries no tags at all, so `describe` would
          # answer nothing and the compare line would silently disappear from
          # every release page.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The script needs `tsx` and nothing else, and it runs no build, so the
      # lifecycle scripts of the dependency tree are dead weight here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Assemble the release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/notes.md"
          # The compare link's other end is a REAL TAG, asked of git, never
          # derived from the CHANGELOG: a heading can exist for a version that
          # was cut and never tagged, and a link built from it would 404.
          # `describe` starts at the tagged commit's parent, so it names the tag
          # before this one; an empty answer means no compare line.
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "compare base: ${previous:-<none>}"
          args=(--version "$version" --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME")
          [ -z "$previous" ] || args+=(--previous-tag "$previous")
          pnpm exec tsx scripts/release-notes.ts "${args[@]}" > "$notes"
          cat "$notes"
          echo "file=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          # GitHub does NOT infer "prerelease" from a semver hyphen: the API
          # defaults to prerelease:false, which also moves the Latest badge. A
          # `-beta` or `-rc` tag must never take that badge from the shipped
          # line, so mark it explicitly.
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags=(--prerelease) ;; esac
          # `--verify-tag` refuses to create the tag as a side effect: this job
          # publishes a page for a tag that already exists, it never invents one.
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "openplate $GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --verify-tag
