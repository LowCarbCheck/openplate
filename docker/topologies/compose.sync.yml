# Deprecated, use compose.core.yml; this file goes away in a later release.
#
# The service this file used to start is called `core` now, and so is the file.
# This stub only includes compose.core.yml, so an old command keeps working for
# one release:
#
#   docker compose -f compose.sync.yml up -d
#
# It starts the same stack with the same project name and the same volume, so
# your database is found. The one change is the service name: `sync` is `core`,
# so a command like `docker compose -f compose.sync.yml logs sync` becomes
# `... logs core`. Stop a stack started from the old file with `down` (never
# `down -v`, that deletes the volume) before you start it from this one, or the
# old `sync` container still holds port 3001. The steps are in README.md next to
# this file, under "Self-host upgrade note".
#
# Fetch compose.core.yml too: `include` reads it from this folder.
#
# The project name is repeated here because Compose takes the name from the file
# you pass with -f, not from a file it includes. Keep it equal to compose.core.yml.
name: openplate-with-sync

include:
  - compose.core.yml
