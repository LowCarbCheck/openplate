# openplate, self-hosted: one stateless container and nothing else.
#
#   curl -O https://raw.githubusercontent.com/LowCarbCheck/openplate/main/docker/compose.yml
#   docker compose -f compose.yml up -d
#
# Run that from whatever directory you downloaded the file into. Compose treats
# the compose file's OWN directory as the project directory, so a `.env` beside
# this file is the one it reads -- not one somewhere further up.
#
# There is no database and no secret to configure. The server stores nothing:
# your diary lives in your browser's own IndexedDB on the device you use it
# from (see .adr/0006-the-app-server-holds-no-accounts.md). Back up with the
# in-app JSON export, not with a database dump.
#
# If you also want the optional end-to-end-encrypted sync service, use
# docker/topologies/compose.sync.yml instead -- THAT one needs a database,
# because the sync service keeps accounts and ciphertext. The other shapes
# (self-hosted AI, or everything at once) sit beside it; docker/topologies/
# README.md is the one-page map.
# Fixes the project name. Without it Compose names the stack after the
# directory the file sits in -- "docker" for anyone running from a checkout --
# and every container and volume inherits that name.
name: openplate

services:
  # Pulls the published multi-arch image from GHCR by default -- no source
  # checkout required for a self-host. To build from source instead (e.g.
  # developing against this repo), comment out `image:` below and uncomment
  # `build:`, then run:
  #   docker compose --project-directory . -f docker/compose.yml build
  #   docker compose --project-directory . -f docker/compose.yml up -d
  # Run those two from the repo root. The build context below is written
  # relative to THIS file, so it points one level up at the checkout, and
  # `--project-directory .` is what makes Compose read the repo root's `.env`
  # instead of the one it would look for in `docker/`.
  app:
    image: ghcr.io/lowcarbcheck/openplate:latest
    # build:
    #   context: ..
    #   dockerfile: Dockerfile.pnpm
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      # Public URL this instance is reachable at. Update this if you put a
      # reverse proxy in front (see docs/self-hosting.md -> HTTPS).
      APP_URL: ${APP_URL:-http://localhost:3000}
      # ON by default -- queries the public LowCarbCheck food database for
      # curated nutrition data (food NAMES only, never photos; fails open on
      # outages). An EMPTY string disables it entirely so no food names ever
      # leave your machine.
      FOOD_DB_API_URL: ${FOOD_DB_API_URL-https://lowcarbcheck.org}
      # Number of reverse proxies in front of this container. React Router's
      # CSRF check compares the browser Origin against the host it thinks it
      # is serving, so a wrong hop count breaks form posts behind a proxy.
      # 1 = one proxy (Caddy, Traefik); 2 = Cloudflare in front of one.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthcheck').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
