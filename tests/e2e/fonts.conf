<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The font environment this tier renders in.

  WHY THIS FILE EXISTS AT ALL. Chromium for Testing carries its OWN copy of
  fontconfig, and that copy reads the host's /etc/fonts/fonts.conf. Fedora 44
  ships fontconfig 2.17, whose fonts.conf opens with
  `<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">`. The older parser
  inside the browser cannot resolve that URN, so it throws the whole file away
  and starts with ZERO font directories. A browser with no fonts still lays
  pages out: every line box comes out 0 px tall, so every piece of text is
  present in the DOM, present in the accessibility tree, and `hidden` to
  Playwright, because Playwright calls an empty bounding box invisible. The
  first `toBeVisible` in `completeOnboarding` is where that lands, which makes
  a system font problem read as a broken app.

  So the tier stops asking the host what its font configuration is and states
  one. The DOCTYPE below is the long-standing spelling that every fontconfig
  release parses. The directories are the ones Fedora's own fonts.conf lists,
  minus the X11 bitmap paths this app never wants.

  THIS IS NOT A FONT PIN. It names DIRECTORIES, not faces, so the host still
  supplies whatever it has installed. The faces the app actually draws with
  (Inter, Fraunces, Victor Mono) are served by the app itself; the host's
  fonts are only the generic fallbacks behind them. What is pinned is that
  there IS a readable configuration, which is the part that broke.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>

  <!--
    Its own cache, not the system one. The host's caches are written by the
    host's fontconfig and carry that version's cache format; letting the
    browser's older copy share the directory would have it rewrite entries the
    desktop then has to rebuild.
  -->
  <cachedir prefix="xdg">openplate-e2e-fontconfig</cachedir>
</fontconfig>
